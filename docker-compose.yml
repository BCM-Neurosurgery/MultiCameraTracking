# Base compose file. Not runnable on its own — always pair with
# docker-compose.gpu.yml or docker-compose.cpu.yml via `-f`:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml build
#
# The Makefile threads the right overlay through based on MOCAP_PROFILE in .env.
services:
  mocap:
    build:
      context: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    tty: true
    stdin_open: true
    environment:
      REACT_APP_BASE_URL: ${REACT_APP_BASE_URL}
      PYTHONUNBUFFERED: 1
      PROJECT_IDS: ${PROJECT_IDS:-TRBD-53761,AA-56119,PerceptOCD-48392,EMU-18112,TRD-43036,TEST-XXXXX}
    volumes:
      - ${DATA_VOLUME}:/data
      - ${CAMERA_CONFIGS}:/configs
      - /etc/localtime:/etc/localtime:ro
      - ${DATAJOINT_EXTERNAL}:/datajoint_external
    network_mode: host
