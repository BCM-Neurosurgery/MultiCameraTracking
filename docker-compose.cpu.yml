# CPU profile overlay. Pair with docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml ...
# (The Makefile does this automatically when MOCAP_PROFILE=cpu in .env.)
services:
  mocap:
    build:
      dockerfile: ./docker/Dockerfile.cpu
    image: peabody124/mocap-cpu
    environment:
      MOCAP_PROFILE: cpu
      FORCE_CPU_ENCODE: "1"
